<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DIG.ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e0a;
    --bg-2:#13140e;
    --line:#2a2c20;
    --ink:#e8e9dd;
    --ink-dim:#8d8f7e;
    --ink-faint:#565848;
    --acid:#d4ff3f;      /* INFLUENCE + system accent */
    --amber:#ffb02e;     /* MATERIAL */
    --ice:#6ee7ff;       /* TECHNIQUE */
    --pink:#ff5ca8;      /* ECHO */
    --bone:#c9cbb8;      /* HISTORY */
    --mono:'IBM Plex Mono',monospace;
    --disp:'Chakra Petch',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    overflow:hidden;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:72px 72px;
    background-position:center center;
  }
  ::selection{background:var(--acid);color:var(--bg)}

  /* ---------- HEADER ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:stretch;
    border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(6px);
    height:56px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:0 20px;border-right:1px solid var(--line);
    font-family:var(--disp);font-weight:700;font-size:15px;
    letter-spacing:.08em;white-space:nowrap;
  }
  .brand .dot{width:8px;height:8px;background:var(--acid);animation:blink 2.4s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  .brand span{color:var(--ink-dim);font-weight:400}
  .head-mid{flex:1;display:flex;align-items:center;padding:0 20px;gap:24px;overflow:hidden}
  .ticker{color:var(--ink-faint);font-size:11px;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
  .rec-count{
    padding:0 20px;display:flex;align-items:center;
    border-left:1px solid var(--line);color:var(--ink-dim);
    font-size:11px;letter-spacing:.1em;white-space:nowrap;
  }
  .rec-count b{color:var(--ink);font-weight:500}
  #pullBtn{
    font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.12em;
    background:var(--acid);color:#101204;border:none;cursor:pointer;
    padding:0 32px;border-left:1px solid var(--line);
    transition:filter .12s;
    text-transform:uppercase;
  }
  #pullBtn:hover{filter:brightness(1.12)}
  #pullBtn:active{filter:brightness(.85)}
  #pullBtn:disabled{opacity:.5;cursor:wait}

  /* ---------- TRAIL ---------- */
  #trail{
    position:fixed;top:56px;left:0;right:0;height:34px;z-index:49;
    display:flex;align-items:center;gap:0;
    padding:0 20px;overflow-x:auto;scrollbar-width:none;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    white-space:nowrap;
  }
  #trail::-webkit-scrollbar{display:none}
  #trail .t-label{color:var(--ink-faint);margin-right:14px;flex:none}
  #trail .crumb{
    color:var(--ink-dim);cursor:pointer;flex:none;
    padding:4px 2px;border-bottom:1px solid transparent;
  }
  #trail .crumb:hover{color:var(--acid)}
  #trail .crumb.here{color:var(--acid);border-bottom-color:var(--acid);cursor:default}
  #trail .sep{color:var(--ink-faint);margin:0 10px;flex:none}
  #trail .depth{margin-left:auto;color:var(--ink-faint);flex:none;padding-left:20px}
  #trail .depth b{color:var(--pink);font-weight:500}

  /* ---------- STAGE ---------- */
  #stage{position:fixed;inset:90px 0 34px 0}

  /* ---------- CARD VIEW ---------- */
  #cardView{
    position:absolute;inset:0;display:grid;
    grid-template-columns:minmax(0,46%) minmax(0,54%);
    opacity:1;transition:opacity .35s cubic-bezier(.16,1,.3,1);
  }
  #cardView.hidden,#mapView.hidden{opacity:0;pointer-events:none}

  .art-pane{
    position:relative;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(24px,4vw,56px);
    background:radial-gradient(ellipse at 50% 40%, #16170f 0%, var(--bg) 70%);
  }
  .thumb-strip{display:flex;gap:8px;margin-top:46px;flex-wrap:wrap;justify-content:center}
  .thumb{
    width:54px;height:54px;object-fit:cover;cursor:pointer;
    border:1px solid var(--line);opacity:.55;
    transition:opacity .12s,border-color .12s;
  }
  .thumb.active{border-color:var(--acid);opacity:1}
  .thumb:hover{opacity:.9}
  .art-frame{position:relative;max-width:100%;max-height:100%}
  .art-frame img{
    display:block;max-width:100%;max-height:calc(100vh - 250px);
    border:1px solid var(--line);
    filter:contrast(1.02);
  }
  /* imageless placard */
  .placard{
    width:min(420px,38vw);aspect-ratio:1/1.1;
    border:1px dashed var(--ink-faint);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:26px;
  }
  .placard .p-kind{
    font-family:var(--disp);font-weight:700;
    font-size:clamp(34px,3.6vw,52px);line-height:.95;
    color:var(--ink-faint);text-transform:uppercase;
    word-break:break-word;
  }
  .placard .p-mid{font-size:10.5px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase;line-height:2}
  .placard .p-mid em{color:var(--amber);font-style:normal}
  .placard .p-num{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--ink-dim);letter-spacing:.1em}
  /* registration marks */
  .reg{position:absolute;width:14px;height:14px;pointer-events:none}
  .reg::before,.reg::after{content:"";position:absolute;background:var(--acid)}
  .reg::before{width:14px;height:1px;top:0;left:0}
  .reg::after{width:1px;height:14px;top:0;left:0}
  .reg.tl{top:-8px;left:-8px}
  .reg.tr{top:-8px;right:-8px;transform:scaleX(-1)}
  .reg.bl{bottom:-8px;left:-8px;transform:scaleY(-1)}
  .reg.br{bottom:-8px;right:-8px;transform:scale(-1)}
  .art-caption{
    position:absolute;bottom:-26px;left:0;right:0;
    display:flex;justify-content:space-between;
    font-size:10px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;
  }

  .dossier{
    padding:clamp(24px,3.5vw,52px) clamp(24px,5vw,72px);
    overflow-y:auto;display:flex;flex-direction:column;gap:0;
  }
  .idx-row{
    display:flex;justify-content:space-between;align-items:baseline;
    color:var(--ink-faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    margin-bottom:18px;
  }
  .idx-row .tag{color:var(--acid)}
  h1.title{
    font-family:var(--disp);font-weight:700;
    font-size:clamp(28px,3.8vw,50px);line-height:.98;
    text-transform:uppercase;letter-spacing:.01em;
    margin-bottom:6px;
  }
  .artist-line{
    font-size:14px;color:var(--ink-dim);margin-bottom:30px;
  }
  .artist-line b{color:var(--ink);font-weight:500}

  .spec{border-top:1px solid var(--line);margin-bottom:30px}
  .spec-row{
    display:flex;align-items:baseline;gap:12px;
    padding:9px 0;border-bottom:1px solid var(--line);
  }
  .spec-row .k{
    flex:0 0 110px;font-size:10px;letter-spacing:.16em;
    color:var(--ink-faint);text-transform:uppercase;
  }
  .spec-row .leader{flex:1;border-bottom:1px dotted var(--ink-faint);opacity:.4;transform:translateY(-3px)}
  .spec-row .v{text-align:right;color:var(--ink);font-size:12.5px}

  .fact{
    border:1px solid var(--line);border-left:3px solid var(--acid);
    background:var(--bg-2);padding:18px 20px;margin-bottom:34px;
  }
  .fact .k{
    font-size:10px;letter-spacing:.16em;color:var(--acid);
    text-transform:uppercase;margin-bottom:8px;
  }
  .fact p{font-size:13.5px;line-height:1.65;color:var(--ink)}
  .fact-head{display:flex;justify-content:space-between;align-items:baseline}
  .fact-next{
    margin-top:12px;padding:0 0 1px;display:inline-block;
    background:none;border:none;border-bottom:1px solid var(--acid);
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    color:var(--acid);cursor:pointer;text-transform:uppercase;
  }
  .fact-next:hover{filter:brightness(1.25)}

  .card-actions{display:flex;gap:14px;align-items:center;margin-top:auto;flex-wrap:wrap}
  #openMap{
    font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.1em;
    background:transparent;color:var(--acid);cursor:pointer;
    border:1px solid var(--acid);padding:13px 26px;text-transform:uppercase;
    transition:background .12s,color .12s;
  }
  #openMap:hover{background:var(--acid);color:#101204}
  .hint{color:var(--ink-faint);font-size:11px;letter-spacing:.05em}

  /* ---------- MAP VIEW ---------- */
  #mapView{
    position:absolute;inset:0;overflow:hidden;
    opacity:1;transition:opacity .35s cubic-bezier(.16,1,.3,1);
    cursor:grab;
    touch-action:none; /* browser never pans/zooms the page here — we handle it */
  }
  #mapView.dragging{cursor:grabbing}
  #world{
    position:absolute;left:50%;top:50%;width:0;height:0;
    will-change:transform;
  }
  #edges{position:absolute;left:-2000px;top:-2000px;width:4000px;height:4000px;pointer-events:none}

  .node{
    position:absolute;transform:translate(-50%,-50%);
    width:232px;background:var(--bg-2);
    border:1px solid var(--line);padding:12px 14px 13px;
    transition:border-color .15s, box-shadow .15s;
  }
  .node.linked{cursor:pointer}
  .node.linked:hover{border-color:var(--acid);box-shadow:0 0 0 1px var(--acid)}
  .node.stub{opacity:.72}
  .node .type-tag{
    display:inline-block;font-size:9px;letter-spacing:.18em;
    padding:3px 7px;margin-bottom:8px;text-transform:uppercase;
    color:#101204;font-weight:500;
  }
  .node h3{
    font-family:var(--disp);font-weight:600;font-size:14.5px;
    line-height:1.15;margin-bottom:6px;text-transform:uppercase;
  }
  .node p{font-size:11.5px;line-height:1.5;color:var(--ink-dim)}
  .node .open-cue{
    margin-top:9px;font-size:10px;letter-spacing:.14em;
    color:var(--acid);text-transform:uppercase;
  }
  .node .stub-cue{
    margin-top:9px;font-size:9.5px;letter-spacing:.14em;
    color:var(--ink-faint);text-transform:uppercase;
  }

  .center-node{
    position:absolute;transform:translate(-50%,-50%);
    width:190px;text-align:center;
  }
  .center-node img{
    width:150px;display:block;margin:0 auto 10px;
    border:1px solid var(--acid);
    box-shadow:0 0 0 6px var(--bg), 0 0 0 7px var(--line);
  }
  .center-node .mini-placard{
    width:150px;height:110px;margin:0 auto 10px;
    border:1px dashed var(--acid);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:700;font-size:15px;
    color:var(--acid);text-transform:uppercase;letter-spacing:.08em;
    background:var(--bg);
    box-shadow:0 0 0 6px var(--bg), 0 0 0 7px var(--line);
  }
  .center-node h2{
    font-family:var(--disp);font-weight:700;font-size:16px;
    text-transform:uppercase;line-height:1.1;
  }
  .center-node .sub{color:var(--ink-dim);font-size:10.5px;margin-top:4px;letter-spacing:.08em}

  .map-topbar{
    position:absolute;top:16px;left:20px;z-index:5;
    display:flex;gap:14px;align-items:center;
  }
  #backBtn{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    background:var(--bg-2);color:var(--ink);border:1px solid var(--line);
    padding:9px 16px;cursor:pointer;text-transform:uppercase;
  }
  #backBtn:hover{border-color:var(--acid);color:var(--acid)}
  .map-title{font-size:11px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase}
  .map-title b{color:var(--ink);font-weight:500}

  .legend{
    position:absolute;bottom:18px;left:20px;z-index:5;
    display:flex;flex-direction:column;gap:6px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    border:1px solid var(--line);padding:12px 16px;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);
  }
  .legend .row{display:flex;align-items:center;gap:10px}
  .legend .sw{width:22px;height:2px}
  .map-help{
    position:absolute;bottom:18px;right:20px;z-index:5;
    font-size:10px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;
    text-align:right;line-height:1.9;
  }
  .map-help em{color:var(--acid);font-style:normal}

  /* ---------- VISITED / ATLAS / RECEIPT ---------- */
  .node.linked.visited{box-shadow:inset 3px 0 0 var(--acid)}
  .ticker.live{cursor:pointer;color:var(--ink-dim)}
  .ticker.live b{color:var(--acid);font-weight:500}
  .ticker.live:hover{color:var(--ink)}
  #atlasBtn{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    background:transparent;color:var(--ink-dim);border:none;
    border-left:1px solid var(--line);padding:0 18px;cursor:pointer;
    text-transform:uppercase;white-space:nowrap;
  }
  #atlasBtn:hover{color:var(--acid)}
  .anode{
    position:absolute;transform:translate(-50%,-50%);
    width:150px;background:var(--bg-2);
    border:1px solid var(--line);padding:9px 11px 10px;
    cursor:pointer;transition:border-color .15s;
  }
  .anode:hover{border-color:var(--acid)}
  .anode.dim{opacity:.55}
  .anode.visited{border-color:color-mix(in srgb, var(--acid) 55%, var(--line))}
  .anode .kchip{
    font-size:8px;letter-spacing:.18em;color:var(--ink-faint);
    text-transform:uppercase;margin-bottom:5px;
  }
  .anode.visited .kchip{color:var(--acid)}
  .anode h4{
    font-family:var(--disp);font-weight:600;font-size:11.5px;
    line-height:1.2;text-transform:uppercase;color:var(--ink);
  }
  .anode.reveal{animation:pop .45s cubic-bezier(.16,1,.3,1) both}
  #trail .crumb.export{
    color:var(--pink);border:1px solid var(--pink);
    padding:3px 9px;margin-left:18px;
  }
  #trail .crumb.export:hover{background:var(--pink);color:var(--bg)}
  #receiptOverlay{
    position:fixed;inset:0;z-index:80;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:color-mix(in srgb, var(--bg) 74%, transparent);
    backdrop-filter:blur(8px);
  }
  #receiptOverlay.hidden{display:none}
  #receiptCanvas{max-width:min(420px,92vw);height:auto;border:1px solid var(--line);box-shadow:0 24px 80px #000a}
  .receipt-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .receipt-actions button{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    background:var(--bg-2);color:var(--ink);border:1px solid var(--line);
    padding:9px 16px;cursor:pointer;text-transform:uppercase;
  }
  .receipt-actions button:hover{border-color:var(--acid);color:var(--acid)}

  /* ---------- FOOTER ---------- */
  footer{
    position:fixed;bottom:0;left:0;right:0;height:34px;z-index:50;
    border-top:1px solid var(--line);
    background:var(--bg);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;font-size:10px;letter-spacing:.14em;
    color:var(--ink-faint);text-transform:uppercase;
  }
  footer .stat b{color:var(--acid);font-weight:500}

  /* shuffle flicker */
  .flicker{animation:flick .07s steps(2) infinite}
  @keyframes flick{50%{opacity:.55}}

  /* entrance */
  .reveal{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .node.reveal{animation:pop .45s cubic-bezier(.16,1,.3,1) both}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .node.stub.reveal{animation-name:pop-stub}
  @keyframes pop-stub{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:.72;transform:translate(-50%,-50%) scale(1)}}

  @media (max-width:860px){
    #cardView{grid-template-columns:1fr;overflow-y:auto;display:block}
    .art-pane{border-right:none;border-bottom:1px solid var(--line);min-height:44vh}
    .art-frame img{max-height:38vh}
    .placard{width:min(320px,80vw)}
    .dossier{padding:28px 22px 60px}
    .head-mid{display:none}
    .node{width:190px}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="dot"></div>DIG<span>.ARCHIVE</span></div>
  <div class="head-mid"><div class="ticker" id="ticker">ART · DESIGN · ARCHITECTURE · CULTURE — PULL A RECORD, OPEN ITS CONSTELLATION, FALL IN</div></div>
  <button id="atlasBtn">⊞ Atlas</button>
  <div class="rec-count" id="recCount">REC <b>—/—</b></div>
  <button id="pullBtn">⟳ Pull</button>
</header>

<div id="trail"></div>

<div id="stage">

  <!-- CARD -->
  <div id="cardView">
    <div class="art-pane" id="artPane"></div>
    <div class="dossier" id="dossier">
      <div class="idx-row"><span class="tag" id="idxTag"></span><span id="idxCat"></span></div>
      <h1 class="title" id="title"></h1>
      <div class="artist-line" id="artistLine"></div>
      <div class="spec" id="spec"></div>
      <div class="fact">
        <div class="k fact-head"><span>// Things you didn't know</span><span id="factCount"></span></div>
        <p id="fact"></p>
        <button class="fact-next" id="factNext">Next fact ▸</button>
      </div>
      <div class="card-actions">
        <button id="openMap">Open constellation ↗</button>
        <span class="hint" id="connHint"></span>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div id="mapView" class="hidden">
    <div class="map-topbar">
      <button id="backBtn">← Dossier</button>
      <div class="map-title">CONSTELLATION // <b id="mapTitle"></b></div>
    </div>
    <div id="world">
      <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="nodes"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="map-help"><em>Click a bright-bordered node to open its record</em><br>Drag to pan · Scroll to zoom · [R] random</div>
  </div>

</div>

<div id="receiptOverlay" class="hidden">
  <canvas id="receiptCanvas"></canvas>
  <div class="receipt-actions">
    <button id="dlReceipt">⇩ Download PNG</button>
    <button id="copyReceipt">Copy text</button>
    <button id="closeReceipt">Close</button>
  </div>
</div>

<footer>
  <div class="stat" id="footStat">SYS <b>ONLINE</b></div>
  <div>UTIL–CYB v0.2 · RABBIT-HOLE BUILD</div>
</footer>

<script>
/* ================= DATA — fetched from records.json ================= */
let TYPES = {}, RECORDS = {}, IDS = [];

/* ================= STATE ================= */
let currentId = 'kiss';
let trail = ['kiss'];
let mapMode = 'record';   // 'record' | 'atlas'

const $ = id => document.getElementById(id);
const recNum = id => String(IDS.indexOf(id)+1).padStart(3,'0');

/* visited records persist across sessions */
const visited = new Set(JSON.parse(localStorage.getItem('dig.visited')||'[]'));
function markVisited(id){
  if(visited.has(id)) return;
  visited.add(id);
  localStorage.setItem('dig.visited', JSON.stringify([...visited]));
}

/* hash = the permalink: #/id, #/id/map, #/atlas */
function syncHash(h){
  if(location.hash !== h) history.pushState(null,'',h);
}

/* ================= TRAIL ================= */
function renderTrail(){
  const t = $('trail');
  t.innerHTML = '<span class="t-label">TRAIL //</span>';
  trail.forEach((id, i)=>{
    if(i>0) t.insertAdjacentHTML('beforeend','<span class="sep">▸</span>');
    const here = i===trail.length-1;
    t.insertAdjacentHTML('beforeend',
      `<span class="crumb ${here?'here':''}" data-i="${i}">${RECORDS[id].title}</span>`);
  });
  if(trail.length>=3) t.insertAdjacentHTML('beforeend','<span class="crumb export" id="exportBtn">⇩ Log</span>');
  t.insertAdjacentHTML('beforeend', `<span class="depth">DEPTH <b>${String(trail.length-1).padStart(2,'0')}</b></span>`);
  t.querySelectorAll('.crumb:not(.here):not(.export)').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.i;
      trail = trail.slice(0, i+1);
      currentId = trail[trail.length-1];
      renderCard(currentId); showView('card'); renderTrail();
      syncHash('#/'+currentId);
    });
  });
  const ex = document.getElementById('exportBtn');
  if(ex) ex.addEventListener('click', openReceipt);
  sessionStorage.setItem('dig.trail', JSON.stringify(trail));
  t.scrollLeft = t.scrollWidth;
}

/* ================= CARD RENDER ================= */
function renderCard(id){
  const h = RECORDS[id];

  // art pane: image or placard
  const pane = $('artPane');
  if(h.img){
    const imgs = [{src:h.img, cap:h.capRight||''}, ...(h.gallery||[])];
    pane.innerHTML = `
      <div class="art-frame reveal" id="artFrame">
        <div class="reg tl"></div><div class="reg tr"></div><div class="reg bl"></div><div class="reg br"></div>
        <img id="artImg" src="${h.img}" alt="${h.title}">
        <div class="art-caption"><span>${h.byline.name.toUpperCase()}</span><span id="capRight">${h.capRight||''}</span></div>
      </div>` +
      (imgs.length>1 ? `<div class="thumb-strip">${imgs.map((g,i)=>
        `<img class="thumb${i===0?' active':''}" src="${g.src}" data-i="${i}" alt="">`).join('')}</div>` : '');
    if(imgs.length>1){
      pane.querySelectorAll('.thumb').forEach(t=>{
        t.addEventListener('click', ()=>{
          const g = imgs[+t.dataset.i];
          pane.querySelector('#artImg').src = g.src;
          pane.querySelector('#capRight').textContent = g.cap || h.capRight || '';
          pane.querySelectorAll('.thumb').forEach(x=>x.classList.toggle('active', x===t));
        });
      });
    }
  } else {
    pane.innerHTML = `
      <div class="art-frame reveal" id="artFrame">
        <div class="reg tl"></div><div class="reg tr"></div><div class="reg bl"></div><div class="reg br"></div>
        <div class="placard">
          <div class="p-kind">${h.kind}<br>FILE</div>
          <div class="p-mid">NO VISUAL RECORD ON FILE<br><em>TEXT DOSSIER ONLY</em><br>${h.capRight||''}</div>
          <div class="p-num">REC ${recNum(id)}</div>
        </div>
        <div class="art-caption"><span>${h.byline.name.toUpperCase()}</span><span>${h.capRight||''}</span></div>
      </div>`;
  }

  $('idxTag').textContent = `REC ${recNum(id)} · ${h.kind}`;
  $('idxCat').textContent = h.cat;
  $('title').textContent = h.title;
  $('artistLine').innerHTML = `<b>${h.byline.name}</b> · ${h.byline.sub}`;

  const facts = [h.fact, ...(h.more||[])];
  let fi = 0;
  const showFact = ()=>{
    $('fact').textContent = facts[fi];
    $('factCount').textContent = facts.length>1
      ? `${String(fi+1).padStart(2,'0')}/${String(facts.length).padStart(2,'0')}` : '';
    $('factNext').style.display = facts.length>1 ? '' : 'none';
  };
  showFact();
  $('factNext').onclick = ()=>{ fi = (fi+1)%facts.length; showFact(); };
  const linked = h.connections.filter(c=>c.ref).length;
  $('connHint').textContent = `${h.connections.length} linked records · ${linked} openable`;
  $('recCount').innerHTML = `REC <b>${recNum(id)}/${String(IDS.length).padStart(3,'0')}</b>`;

  const spec = $('spec');
  spec.innerHTML = '';
  for(const [k,v] of Object.entries(h.spec)){
    spec.insertAdjacentHTML('beforeend',
      `<div class="spec-row"><span class="k">${k.replace(/_/g,' ')}</span><span class="leader"></span><span class="v">${v}</span></div>`);
  }
  $('dossier').classList.remove('reveal'); void $('dossier').offsetWidth; $('dossier').classList.add('reveal');
  markVisited(id);
  $('footStat').innerHTML = `SYS <b>ONLINE</b> · EXPLORED <b>${visited.size}/${IDS.length}</b> · IMG: WIKIMEDIA COMMONS · PD/CC`;
}

/* ================= NAVIGATION ================= */
function openRecord(id, {resetTrail=false, view='card', silent=false}={}){
  if(resetTrail){ trail = [id]; }
  else if(trail[trail.length-1] !== id){ trail.push(id); }
  currentId = id;
  renderCard(id);
  renderTrail();
  if(view==='map'){ renderMap(id); showView('map'); }
  else showView('card');
  if(!silent) syncHash(view==='map' ? `#/${id}/map` : `#/${id}`);
}

/* ================= ROUTER ================= */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  if(!h){ showView('card'); return; }
  if(h==='atlas'){ openAtlas(true); return; }
  const [id, sub] = h.split('/');
  if(!RECORDS[id]) return;
  const wantMap = sub==='map';
  if(id !== currentId){
    openRecord(id, {view: wantMap?'map':'card', silent:true});
  } else if(wantMap){
    renderMap(id); showView('map');
  } else {
    showView('card');
  }
}
window.addEventListener('hashchange', route);

/* ================= PULL (slot shuffle) ================= */
let lastPull = -1;
function pull(){
  // prefer records you haven't opened yet
  let pool = IDS.filter(id=>RECORDS[id].pullable && !visited.has(id));
  if(!pool.length) pool = IDS.filter(id=>RECORDS[id].pullable);
  const btn = $('pullBtn');
  btn.disabled = true;
  let next;
  do { next = pool[Math.floor(Math.random()*pool.length)]; } while(pool.length>1 && next===lastPull);
  lastPull = next;

  showView('card');
  const t = $('title');
  t.classList.add('flicker');
  let ticks = 0;
  const iv = setInterval(()=>{
    const r = IDS[Math.floor(Math.random()*IDS.length)];
    t.textContent = RECORDS[r].title;
    ticks++;
    if(ticks>=9){
      clearInterval(iv);
      t.classList.remove('flicker');
      openRecord(next, {resetTrail:true});
      btn.disabled = false;
    }
  }, 75);
}

/* ================= MAP ================= */
let pan = {x:0,y:0}, zoom = 1;
function applyTransform(){
  $('world').style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
}

function nodePositions(n){
  // radial spread, alternating radii, slight per-index jitter for asymmetry
  const pts = [];
  const offset = -Math.PI/2 + 0.35;
  for(let i=0;i<n;i++){
    const a = offset + (i * 2*Math.PI/n);
    const r = (i%2===0 ? 330 : 440) + ((i*29)%40) - 20;
    pts.push([Math.round(Math.cos(a)*r*1.25), Math.round(Math.sin(a)*r*0.82)]);
  }
  return pts;
}

function renderMap(id){
  mapMode = 'record';
  const h = RECORDS[id];
  $('mapTitle').textContent = h.title.toUpperCase();
  const nodes = $('nodes'), edges = $('edges');
  nodes.innerHTML = ''; edges.innerHTML = '';
  pan = {x:0,y:0}; zoom = 1; applyTransform();

  // center node
  const centerVisual = h.img
    ? `<img src="${h.img}" alt="">`
    : `<div class="mini-placard">${h.kind}<br>FILE</div>`;
  nodes.insertAdjacentHTML('beforeend', `
    <div class="center-node reveal" style="left:0;top:0">
      ${centerVisual}
      <h2>${h.title}</h2>
      <div class="sub">${h.byline.name} · ${h.capRight||''}</div>
    </div>`);

  const pos = nodePositions(h.connections.length);
  h.connections.forEach((c, idx)=>{
    const [nx,ny] = pos[idx];
    const tt = TYPES[c.type];
    const isLink = !!c.ref;
    const displayTitle = isLink ? RECORDS[c.ref].title : c.title;

    edges.insertAdjacentHTML('beforeend',
      `<line x1="2000" y1="2000" x2="${2000+nx}" y2="${2000+ny}"
        stroke="${tt.hex}" stroke-width="1.5" stroke-dasharray="${tt.dash}" opacity="${isLink?0.85:0.45}"/>`);

    const cue = isLink
      ? `<div class="open-cue">▸ Open record ${recNum(c.ref)}</div>`
      : `<div class="stub-cue">// Archive stub — not yet digitized</div>`;

    nodes.insertAdjacentHTML('beforeend', `
      <div class="node reveal ${isLink?'linked':'stub'}${isLink && visited.has(c.ref)?' visited':''}" ${isLink?`data-ref="${c.ref}"`:''}
           style="left:${nx}px;top:${ny}px;animation-delay:${idx*60}ms">
        <span class="type-tag" style="background:${tt.hex}">${c.type}</span>
        <h3>${displayTitle}</h3>
        <p>${c.note}</p>
        ${cue}
      </div>`);
  });
}

/* ================= ATLAS — the whole archive as one constellation ================= */
function atlasPositions(){
  const byKind = {};
  IDS.forEach(id=>{ (byKind[RECORDS[id].kind] = byKind[RECORDS[id].kind]||[]).push(id); });
  const kinds = Object.keys(byKind);
  const pos = {};
  kinds.forEach((k, ki)=>{
    const a = -Math.PI/2 + ki*2*Math.PI/kinds.length;
    const cx = Math.cos(a)*700, cy = Math.sin(a)*430;
    const ids = byKind[k];
    ids.forEach((id, i)=>{
      if(ids.length===1){ pos[id]=[Math.round(cx),Math.round(cy)]; return; }
      const aa = ki*1.7 + i*2*Math.PI/ids.length;
      const rr = (ids.length>4 ? 200 : 120) + ((i*37)%40);
      pos[id]=[Math.round(cx+Math.cos(aa)*rr*1.15), Math.round(cy+Math.sin(aa)*rr*0.75)];
    });
  });
  return pos;
}

function openAtlas(silent=false){
  mapMode = 'atlas';
  $('mapTitle').textContent = `FULL ARCHIVE · ${IDS.length} RECORDS · ${visited.size} EXPLORED`;
  const nodes = $('nodes'), edges = $('edges');
  nodes.innerHTML = ''; edges.innerHTML = '';
  pan = {x:0,y:0}; zoom = 0.55; applyTransform();

  const pos = atlasPositions();
  const drawn = new Set();
  IDS.forEach(id=>RECORDS[id].connections.forEach(c=>{
    if(!c.ref || !pos[c.ref]) return;
    const key = [id, c.ref].sort().join('|');
    if(drawn.has(key)) return; drawn.add(key);
    const [x1,y1]=pos[id], [x2,y2]=pos[c.ref];
    edges.insertAdjacentHTML('beforeend',
      `<line x1="${2000+x1}" y1="${2000+y1}" x2="${2000+x2}" y2="${2000+y2}"
        stroke="${TYPES[c.type].hex}" stroke-width="1" stroke-dasharray="${TYPES[c.type].dash}" opacity="0.38"/>`);
  }));
  IDS.forEach((id, i)=>{
    const r = RECORDS[id], [x,y] = pos[id];
    nodes.insertAdjacentHTML('beforeend', `
      <div class="anode reveal ${visited.has(id)?'visited':'dim'}" data-ref="${id}"
           style="left:${x}px;top:${y}px;animation-delay:${Math.min(i*25,500)}ms">
        <div class="kchip">${r.kind}${visited.has(id)?' · SEEN':''}</div>
        <h4>${r.title}</h4>
      </div>`);
  });
  showView('map');
  if(!silent) syncHash('#/atlas');
}

/* ================= RECEIPT — export your descent ================= */
function receiptText(){
  const lines = trail.map((id,i)=>`${i===0?'  ':'▸ '}${String(i+1).padStart(2,'0')} ${RECORDS[id].title.toUpperCase()}`);
  return [
    'DIG.ARCHIVE // DESCENT LOG',
    ...lines,
    `DEPTH ${String(trail.length-1).padStart(2,'0')} · EXPLORED ${visited.size}/${IDS.length}`,
    `https://dig-archive.vercel.app/#/${trail[trail.length-1]}`,
  ].join('\n');
}

function openReceipt(){
  const c = $('receiptCanvas');
  const W = 420, PAD = 28, LH = 30;
  const H = 118 + trail.length*LH + 128;
  const s = 2;
  c.width = W*s; c.height = H*s; c.style.width = W+'px';
  const x = c.getContext('2d');
  x.scale(s, s);

  x.fillStyle = '#0d0e0a'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#2a2c20'; x.lineWidth = 1; x.strokeRect(8.5, 8.5, W-17, H-17);
  x.strokeStyle = '#d4ff3f'; x.strokeRect(12.5, 12.5, W-25, H-25);

  x.fillStyle = '#d4ff3f'; x.font = '700 17px "Chakra Petch", monospace';
  x.fillText('DIG.ARCHIVE', PAD, 50);
  x.fillStyle = '#8d8f7e'; x.font = '10px "IBM Plex Mono", monospace';
  x.fillText('// DESCENT LOG', PAD + 128, 50);
  const now = new Date();
  x.fillText(now.toISOString().slice(0,10), W - PAD - 70, 50);

  x.strokeStyle = '#565848'; x.setLineDash([4,4]);
  x.beginPath(); x.moveTo(PAD, 68); x.lineTo(W-PAD, 68); x.stroke();
  x.setLineDash([]);

  let y = 98;
  trail.forEach((id, i)=>{
    x.fillStyle = '#565848'; x.font = '10px "IBM Plex Mono", monospace';
    x.fillText((i===0?'  ':'▸ ') + String(i+1).padStart(2,'0'), PAD, y);
    x.fillStyle = i===trail.length-1 ? '#d4ff3f' : '#e8e9dd';
    x.font = '600 14px "Chakra Petch", monospace';
    let t = RECORDS[id].title.toUpperCase();
    if(t.length > 30) t = t.slice(0,29) + '…';
    x.fillText(t, PAD + 40, y);
    y += LH;
  });

  x.strokeStyle = '#565848'; x.setLineDash([4,4]);
  x.beginPath(); x.moveTo(PAD, y); x.lineTo(W-PAD, y); x.stroke();
  x.setLineDash([]);
  y += 26;
  x.fillStyle = '#ff5ca8'; x.font = '11px "IBM Plex Mono", monospace';
  x.fillText(`DEPTH ${String(trail.length-1).padStart(2,'0')}`, PAD, y);
  x.fillStyle = '#8d8f7e';
  x.fillText(`EXPLORED ${visited.size}/${IDS.length}`, PAD + 92, y);
  y += 24;
  x.fillStyle = '#d4ff3f'; x.font = '10px "IBM Plex Mono", monospace';
  x.fillText('DIG-ARCHIVE.VERCEL.APP', PAD, y);

  // deterministic barcode from the trail
  const seedStr = trail.join('|');
  let bx = PAD; y += 16;
  for(let i=0; bx < W-PAD-4; i++){
    const w = (seedStr.charCodeAt(i % seedStr.length) % 4) + 1;
    if(i % 2 === 0){ x.fillStyle = '#c9cbb8'; x.fillRect(bx, y, w, 18); }
    bx += w + 2;
  }

  $('receiptOverlay').classList.remove('hidden');
}

function buildLegend(){
  const lg = $('legend');
  lg.innerHTML = '<div class="row" style="color:var(--ink);margin-bottom:2px">LINK TYPES</div>';
  for(const [name,t] of Object.entries(TYPES)){
    lg.insertAdjacentHTML('beforeend',
      `<div class="row"><span class="sw" style="background:${t.hex}"></span>${name}</div>`);
  }
}

/* pan + pinch-zoom — zooms the constellation only, never the page */
(function(){
  const mv = $('mapView');
  const pointers = new Map();               // active pointerId -> {x,y}
  let moved=false, px=0, py=0, sx=0, sy=0;  // single-drag state
  let startDist=0, startZoom=1, startMid=null; // pinch state

  const pts  = ()=>[...pointers.values()];
  const mid  = ()=>{ const p=pts(); return {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; };
  const dist = ()=>{ const p=pts(); return Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); };
  const center = ()=>{ const r=mv.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; };

  // rescale so the world point under (screenX,screenY) stays under it
  function zoomAt(screenX, screenY, nz){
    nz = Math.min(1.8, Math.max(0.4, nz));
    const c = center();
    const wx = (screenX-c.x-pan.x)/zoom, wy = (screenY-c.y-pan.y)/zoom;
    pan.x = screenX-c.x-wx*nz;
    pan.y = screenY-c.y-wy*nz;
    zoom = nz;
    applyTransform();
  }

  mv.addEventListener('pointerdown', e=>{
    if(e.target.closest('button')) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    mv.setPointerCapture(e.pointerId);
    if(pointers.size===1){
      moved=false; sx=e.clientX; sy=e.clientY; px=pan.x; py=pan.y;
    } else if(pointers.size===2){
      moved=true; // a pinch is never a click
      startDist=dist(); startZoom=zoom; startMid=mid(); px=pan.x; py=pan.y;
      mv.classList.add('dragging');
    }
  });

  mv.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const m = mid();
      pan.x = px + (m.x - startMid.x);
      pan.y = py + (m.y - startMid.y);
      zoomAt(m.x, m.y, startZoom * dist()/startDist);
    } else if(pointers.size===1){
      const dx = e.clientX-sx, dy = e.clientY-sy;
      if(Math.abs(dx)>4||Math.abs(dy)>4){ moved=true; mv.classList.add('dragging'); }
      if(moved){ pan.x = px+dx; pan.y = py+dy; applyTransform(); }
    }
  });

  function release(e){
    const wasSingleTap = pointers.size===1 && !moved;
    pointers.delete(e.pointerId);
    if(pointers.size===0){
      mv.classList.remove('dragging');
      if(wasSingleTap){
        // plain tap — hit-test under the pointer (capture retargets e.target)
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const node = el && el.closest('.node.linked, .anode');
        if(node) openRecord(node.dataset.ref);
      }
      moved=false;
    } else if(pointers.size===1){
      // pinch ended with one finger down — rebase as a fresh drag
      const p = pts()[0];
      sx=p.x; sy=p.y; px=pan.x; py=pan.y; moved=true;
    }
  }
  mv.addEventListener('pointerup', release);
  mv.addEventListener('pointercancel', release);

  mv.addEventListener('wheel', e=>{
    e.preventDefault(); // trackpad pinch (ctrlKey) + scroll both zoom the map, anchored at cursor
    zoomAt(e.clientX, e.clientY, zoom * (e.deltaY<0 ? 1.08 : 0.925));
  }, {passive:false});

  // iOS Safari: kill page-level pinch everywhere (it ignores user-scalable=no)
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>
    document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
})();

/* ================= VIEW SWITCH ================= */
function showView(v){
  $('cardView').classList.toggle('hidden', v!=='card');
  $('mapView').classList.toggle('hidden', v!=='map');
}

$('openMap').addEventListener('click', ()=>{ renderMap(currentId); showView('map'); syncHash(`#/${currentId}/map`); });
$('backBtn').addEventListener('click', ()=>{ showView('card'); syncHash(`#/${currentId}`); });
$('pullBtn').addEventListener('click', pull);
$('atlasBtn').addEventListener('click', ()=> openAtlas());
$('closeReceipt').addEventListener('click', ()=> $('receiptOverlay').classList.add('hidden'));
$('receiptOverlay').addEventListener('click', e=>{ if(e.target.id==='receiptOverlay') e.currentTarget.classList.add('hidden'); });
$('dlReceipt').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = $('receiptCanvas').toDataURL('image/png');
  a.download = 'dig-archive-descent.png';
  a.click();
});
$('copyReceipt').addEventListener('click', e=>{
  navigator.clipboard.writeText(receiptText()).then(()=>{
    e.target.textContent = 'Copied ✓';
    setTimeout(()=>e.target.textContent='Copy text', 1500);
  });
});
document.addEventListener('keydown', e=>{
  if(!$('receiptOverlay').classList.contains('hidden')){
    if(e.key==='Escape') $('receiptOverlay').classList.add('hidden');
    return;
  }
  if(e.key==='r'||e.key==='R') pull();
  if(e.key==='a'||e.key==='A') openAtlas();
  if(e.key==='Escape'){ showView('card'); syncHash(`#/${currentId}`); }
});

/* ================= INIT ================= */
fetch('records.json')
  .then(r=>r.json())
  .then(data=>{
    TYPES = data.types; RECORDS = data.records; IDS = Object.keys(RECORDS);

    // record of the day — deterministic from the date
    const pool = IDS.filter(i=>RECORDS[i].pullable);
    const daily = pool[Math.floor(Date.now()/86400000) % pool.length];
    const tk = $('ticker');
    tk.innerHTML = `TODAY'S RECORD // <b>${RECORDS[daily].title.toUpperCase()}</b> — OPEN ▸`;
    tk.classList.add('live');
    tk.onclick = ()=> openRecord(daily, {resetTrail:true});

    // restore: permalink first, then this session's trail
    const h = location.hash.replace(/^#\/?/, '');
    const [hid, sub] = h.split('/');
    const saved = JSON.parse(sessionStorage.getItem('dig.trail')||'null');
    const savedValid = Array.isArray(saved) && saved.length && saved.every(x=>RECORDS[x]);
    if(RECORDS[hid]){
      trail = (savedValid && saved[saved.length-1]===hid) ? saved : [hid];
      currentId = hid;
    } else if(savedValid){
      trail = saved; currentId = saved[saved.length-1];
    }

    buildLegend(); renderCard(currentId); renderTrail();
    if(h==='atlas') openAtlas(true);
    else if(sub==='map'){ renderMap(currentId); showView('map'); }
  })
  .catch(()=>{ document.getElementById('ticker').textContent = 'RECORDS.JSON FAILED TO LOAD — SERVE OVER HTTP (npx serve .) OR CHECK DEPLOY'; });
</script>
